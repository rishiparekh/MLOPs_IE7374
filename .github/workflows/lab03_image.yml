# Builds the Lab_03 TFX image and publishes it to GHCR so that running the lab
# is a pull rather than a ~15 minute local build.
#
# The build is slow (TensorFlow and its wheels are large, and pyfarmhash is
# compiled from source), which is exactly why it belongs in CI and not on
# whoever is trying to run the notebook.
name: Lab_03 image

on:
  push:
    branches: [master, main]
    paths:
      - "Lab_03/Dockerfile"
      - "Lab_03/requirements.lock.txt"
      - ".github/workflows/lab03_image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lab03-tfx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The default GITHUB_TOKEN can publish packages when asked for it here,
      # so no personal access token is needed.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Lab_03
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.16.0
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache in the registry, so a rebuild that only touches the
          # lock does not re-download every wheel.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image imports TFX
        run: |
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.16.0" \
            python -c "
          from tfx import v1 as tfx
          import tensorflow as tf, tensorflow_transform as tft
          import tensorflow_data_validation as tfdv, dill
          print('TFX', tfx.__version__, '| TF', tf.__version__, '| TFT', tft.__version__)
          print('TFDV', tfdv.__version__, '| dill', dill.__version__)
          "
