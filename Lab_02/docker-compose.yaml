# Airflow 3 stack for the air-quality lab.
#
# Deliberately smaller than the official compose file: LocalExecutor instead of
# Celery, so there is no Redis and no separate worker container. Tasks run as
# subprocesses of the scheduler, which is why port 5555 (the Flask dashboard)
# is published there and not on the apiserver.
#
# If your course pins a different Airflow version, reuse the docker-compose
# from Lab 2 and just add the two bind mounts (working_data, model) and the
# 5555 port mapping -- those are the only parts this lab actually requires.
---
x-airflow-common: &airflow-common
  image: apache/airflow:3.0.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-please-change-me-in-a-real-deployment}"

    # REQUIRED on Airflow 3 whenever tasks run in a different container from
    # the apiserver. A task subprocess no longer talks to the metadata DB
    # directly -- it calls back over the Task Execution API, which defaults to
    # http://localhost:8080/execution/. Inside the scheduler container nothing
    # listens on 8080, so without this every task is queued, retries the API
    # four times, gets SIGKILLed, and the run hangs forever with no error in
    # the scheduler log.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    # Username/password auth so the Flask DAG can mint a token against
    # POST /auth/token. The default Airflow 3 auth manager generates a random
    # password instead, which a scripted client cannot guess.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # No _PIP_ADDITIONAL_REQUIREMENTS. apache/airflow:3.0.3 already ships
    # everything this pipeline imports:
    #
    #   pandas 2.2.3   numpy 2.2.6   scikit-learn 1.7.0   requests 2.32.4
    #   joblib 1.5.1   providers: fab 2.3.0, smtp 2.1.1, standard 1.4.1
    #
    # Listing them here only forced pip to DOWNGRADE four of them on every
    # container start -- slow, and a good way to break Airflow's own pinned
    # dependency set. requirements.txt still pins exact versions for the local
    # venv and CI, where there is no base image to inherit from.

    # ---- Pipeline configuration (consumed by dags/src/config.py) ----
    AQ_WORKING_DIR: /opt/airflow/working_data
    AQ_MODEL_DIR: /opt/airflow/model
    AQ_LATITUDE: "${AQ_LATITUDE:-42.3601}"
    AQ_LONGITUDE: "${AQ_LONGITUDE:--71.0589}"
    AQ_LOCATION_NAME: "${AQ_LOCATION_NAME:-Boston, MA}"
    AQ_HORIZON_HOURS: "${AQ_HORIZON_HOURS:-1}"
    AQ_ALERT_EMAIL: "${AQ_ALERT_EMAIL:-}"

    # ---- Flask dashboard -> Airflow REST API ----
    AIRFLOW_WEBSERVER: http://airflow-apiserver:8080
    AIRFLOW_USERNAME: airflow
    AIRFLOW_PASSWORD: airflow
    TARGET_DAG_ID: Airflow_Lab2_AirQuality

    # ---- SMTP (optional; leave unset to disable email) ----
    AIRFLOW__SMTP__SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
    AIRFLOW__SMTP__SMTP_STARTTLS: "true"
    AIRFLOW__SMTP__SMTP_SSL: "false"
    AIRFLOW__SMTP__SMTP_PORT: "587"
    AIRFLOW__SMTP__SMTP_USER: "${SMTP_USER:-}"
    AIRFLOW__SMTP__SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    AIRFLOW__SMTP__SMTP_MAIL_FROM: "${SMTP_USER:-airflow@example.com}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    # Bind-mounted rather than named volumes so you can open the artifacts
    # (metrics JSON, pickled models) in your editor while debugging.
    - ./working_data:/opt/airflow/working_data
    - ./model:/opt/airflow/model
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    ports:
      # The Flask dashboard task runs here under LocalExecutor.
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow \
          --role Admin --email airflow@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-cli:
    <<: *airflow-common
    profiles: ["debug"]
    command: bash
    restart: "no"

volumes:
  postgres-db-volume:
